name: Integration Test
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes a running test
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  find-tests:
    name: Find Tests
    runs-on: ubuntu-latest

    outputs:
      folders: ${{ steps.jobs.outputs.folders }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: jobs
        name: List test folders
        run: |
          folders=$(find tests/bats -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -cs .)
          echo "$folders"
          echo "folders=$folders" >> "$GITHUB_OUTPUT"

  test:
    needs: [find-tests]
    strategy:
      matrix:
        inputs: ${{fromJson(needs.find-tests.outputs.folders)}}

    name: Run Bats Tests
    runs-on: ubuntu-latest

    steps:
      - name: Setup BATS
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        # The token is only used to download bats without hitting API rate limits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Retries and the per test timeout are set in tests/bats/util.bash
      - name: Run tests
        timeout-minutes: 45
        run: bats "./tests/bats/$TEST_FOLDER"
        env:
          TEST_FOLDER: ${{ matrix.inputs }}
