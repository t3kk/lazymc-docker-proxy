name: Integration Test
on:
  push:
    branches:
      - master
      - main
  pull_request:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  find-tests:
    name: Find Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      folders: ${{ steps.jobs.outputs.folders }}
    steps:
      - uses: actions/checkout@v7

      - id: jobs
        name: List test folders
        run: |
          folders=$(find tests/bats -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -cs .)
          echo "$folders"
          echo "folders=$folders" >> "$GITHUB_OUTPUT"

  test:
    needs: [find-tests]
    strategy:
      matrix:
        inputs: ${{fromJson(needs.find-tests.outputs.folders)}}

    name: Run Bats Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Setup BATS
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Checkout repository
        uses: actions/checkout@v7

      # Retries and the per test timeout are set in tests/bats/util.bash
      - name: Run tests
        timeout-minutes: 150
        run: bats "./tests/bats/$TEST_FOLDER"
        env:
          TEST_FOLDER: ${{ matrix.inputs }}
