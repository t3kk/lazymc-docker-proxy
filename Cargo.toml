[package]
name = "lazymc-docker-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.74.0"

[dependencies]
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
futures = "0.3.34"
log = "0.4"
pretty_env_logger = "0.5"
regex = "1.13.1"
serde = "1.0.229"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = [
    "rt-multi-thread",
] }
toml = "1.2.1"
